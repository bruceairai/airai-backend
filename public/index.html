<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AIrAI Widget</title>
<link rel="stylesheet" href="airai-widget.css" />
</head>
<body>

<div id="airai-chat-button">
  <img src="https://yourcdn.com/airai-logo.png" alt="AIrAI" />
</div>

<div id="airai-chat-window" class="hidden">
  <div id="airai-header">AIrAI Assistant</div>
  <div id="airai-messages"></div>
  <div id="airai-input-area">
    <input id="airai-input" placeholder="Type your message..." />
    <button id="airai-send">Send</button>
  </div>
</div>

<script src="airai-widget.js"></script>
</body>
</html>
